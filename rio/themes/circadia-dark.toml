# Circadia — Dark Classic (Warm Ember & Espresso)
# Canvas #17130f, accent #e89a49. Maps the Circadia dark 16-color terminal
# matrix (spec/token-map.md) plus UI tokens to Rio's color slots.
[colors]
# Regular colors (ANSI 0-7)
background = '#17130f'
black = '#17130f'
red = '#db8935'
green = '#8cbb62'
yellow = '#d99148'
blue = '#66abc6'
magenta = '#b991db'
cyan = '#66abc6'
white = '#c9c0b1'
foreground = '#c9c0b1'

# Cursor
cursor = '#e89a49'
vi-cursor = '#66abc6'

# Navigation
tabs = '#29241e'
tabs-foreground = '#aba195'
tabs-active = '#29241e'
tabs-active-highlight = '#e89a49'
tabs-active-foreground = '#eae3d8'
bar = '#1e1a15'
split = '#29241e'

# Search
search-match-background = '#e89a49'
search-match-foreground = '#17130f'
search-focused-match-background = '#f8c88f'
search-focused-match-foreground = '#17130f'

# Hints
hint-foreground = '#17130f'
hint-background = '#e89a49'

# Selection
selection-foreground = '#17130f'
selection-background = '#e89a49'

# Dim colors
dim-black = '#1e1a15'
dim-blue = '#4a7d92'
dim-cyan = '#4a7d92'
dim-foreground = '#91887d'
dim-green = '#6e9452'
dim-magenta = '#8a6a9e'
dim-red = '#b56f2b'
dim-white = '#91887d'
dim-yellow = '#a8742f'

# Light colors (ANSI bright 8-15 — Circadia bright matrix)
light-black = '#91887d'
light-blue = '#66abc6'
light-cyan = '#66abc6'
light-foreground = '#eae3d8'
light-green = '#8cbb62'
light-magenta = '#de88a6'
light-red = '#ea9d49'
light-white = '#eae3d8'
light-yellow = '#f8c88f'
