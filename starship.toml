"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1500

format = """
$os\
$shell\
$nodejs\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$fill\
$time\
$line_break\
$character
"""

[os]
disabled = false
format = "$symbol "
symbols.Macos = "[╭─▶](cyan)"

[shell]
disabled = false
bash_indicator = "bash"
cmd_indicator = "cmd"
zsh_indicator = "[zsh](green)"

[directory]
style = "blue"

[character]
success_symbol = "[╰─▶](cyan)"
error_symbol = "[╰─▶](red)"
vimcmd_symbol = "[❮](green)"

[fill]
symbol = " "

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"

[git_branch]
format = "[$symbol$branch]($style)"
style = "bright-black"
symbol = ""

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = ""
untracked = ""
modified = ""
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
staged = '[++\($count\)](green)'
renamed = ""
deleted = ""
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
disabled = true

[package]
disabled = true

[elixir]
format = '[$symbol]($style)'

[nodejs]
format = "[$symbol($version )]($style)"
style = "green"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
